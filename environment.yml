# Minimal env to train PAVR on cached GFM features (no Evo2 backbone required).
name: pavr
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip>=24
  - pytorch::pytorch>=2.1.0
  - pytorch::pytorch-cuda=12.1
  - numpy=1.26.4
  - pandas>=2.0
  - scikit-learn>=1.3
  - scipy>=1.11
  - tqdm
  - pyyaml
